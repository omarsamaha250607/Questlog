function updateJourney(id,f){
 refreshDay();const e=S.epics.find(e=>e.id===id);if(!e)return;const title=f.elements.namedItem("title").value.trim();if(!title)return;
 if(e.target){const target=Number(f.elements.namedItem("target").value),total=Number(f.elements.namedItem("total").value),due=f.elements.namedItem("due").value;
  if(!Number.isFinite(target)||target<=0||target>1e12||!Number.isFinite(total)||total<0||total>(e.cur||0)||target<total||!validDate(due)||daysBetween(e.start,due)<1)return toast("Check the target, date, and corrected total");
  if(wholeUnit(e.unit)&&!Number.isInteger(target))return toast("Use a whole-number target for "+e.unit);
  lockPlan();e.cur=total;e.target=target;e.due=due;
  // Retain each milestone's reward ledger, even after a correction or target edit.
  const freshMs=milestones(target,e.unit);e.paidSlots=e.paidSlots||e.ms.map(m=>!!m.paid);e.ms=freshMs.map((m,i)=>({...m,paid:e.paidSlots[i]||false,d:total>=m.at}));

  const q=S.quests.find(q=>q.id===e.questId);if(q)q.archived=!!e.archived||total>=target;
 }
 e.t=title;save();closeSheet();render();toast("Journey updated. This week’s targets are unchanged.");
}

// Nothing changes for normal saves. Only when a save grows past PRUNE_AT characters is old, low-value history trimmed:
// daily XP history, old journey log entries and old weekly reviews. Quests, journeys, totals, streaks, gold and
// achievements are never touched. The first time it happens, the untrimmed copy is kept on this device.
const PRUNE_AT=180000,PRUNE_HARD=250000;
let pruneNoted=false;
function trimHistory(days,logs,reviews){
 const cut=addDays(today,-days);Object.keys(S.hist).forEach(k=>{if(k<cut)delete S.hist[k]});
 S.epics.forEach(e=>{if(Array.isArray(e.logs)&&e.logs.length>logs)e.logs=e.logs.slice(-logs)});
 const ks=Object.keys(S.reviews).sort();ks.slice(0,Math.max(0,ks.length-reviews)).forEach(k=>{if(k!==S.week.k)delete S.reviews[k]})}
function pruneIfLarge(){
 let j=JSON.stringify(S);if(j.length<=PRUNE_AT)return j;
 try{if(!localStorage.getItem("questlog_backup_before_prune"))localStorage.setItem("questlog_backup_before_prune",j)}catch(e){}
 trimHistory(400,100,52);j=JSON.stringify(S);
 if(j.length>PRUNE_HARD){trimHistory(120,30,12);j=JSON.stringify(S)}
 if(!pruneNoted){pruneNoted=true;try{toast("Older history was trimmed to keep your saves small. A full copy was kept on this device.")}catch(e){}}
 return j}

// Refresh on resume and before actions, including an overnight tab.
rollover();
// Existing completions/reviews immediately freeze the migration week's known commitments.
if(Object.values(S.week.done).some(n=>n>0)||Object.keys(S.week.gp).length||S.reviews[S.week.k])S.week.locked=true;
CLOUD.quiet=true;save();CLOUD.quiet=false;render();cloudBoot();
if(migrationNotice)setTimeout(()=>toast(migrationNotice),800);
setInterval(()=>{if(document.visibilityState!=="hidden"&&refreshDay())render()},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&refreshDay())render()});
window.addEventListener("focus",()=>{if(refreshDay())render()});
window.addEventListener("storage",e=>{if(e.key==="questlog"){storageBlocked=true;storageError="Questlog changed in another tab. Reload to use that save and avoid overwriting it.";storageNotice()}});

</script>
</body>
