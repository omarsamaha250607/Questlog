function updateJourney(id,f){
 refreshDay();const e=S.epics.find(e=>e.id===id);if(!e)return;const title=f.elements.namedItem("title").value.trim();if(!title)return;
 if(e.target){const target=Number(f.elements.namedItem("target").value),total=Number(f.elements.namedItem("total").value),due=f.elements.namedItem("due").value;
  if(!Number.isFinite(target)||target<=0||target>1e12||!Number.isFinite(total)||total<0||total>(e.cur||0)||target<total||!validDate(due)||daysBetween(e.start,due)<1)return toast("Check the target, date, and corrected total");
  if(wholeUnit(e.unit)&&!Number.isInteger(target))return toast("Use a whole-number target for "+e.unit);
  lockPlan();e.cur=total;e.target=target;e.due=due;
  // Retain each milestone's reward ledger, even after a correction or target edit.
  const freshMs=milestones(target,e.unit);e.paidSlots=e.paidSlots||e.ms.map(m=>!!m.paid);e.ms=freshMs.map((m,i)=>({...m,paid:e.paidSlots[i]||false,d:total>=m.at}));
  // Target edits cannot unlock additional XP: previously paid slots remain paid.
  if(e.finishedAwarded)e.ms.forEach((m,i)=>{m.paid=true;e.paidSlots[i]=true});
  e.logs.push({date:today,correction:true,total});
  const q=S.quests.find(q=>q.id===e.questId);if(q)q.archived=!!e.archived||total>=target;
 }
 e.t=title;save();closeSheet();render();toast("Journey updated. This week’s targets are unchanged.");
}

function radar(){const D=S.focus,n=D.length,mx=Math.max(50,...D.map(d=>S.stats[d]||0)),pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[100+r*Math.cos(a),100+r*Math.sin(a)].map(v=>v.toFixed(1)).join(",")};

 msg.textContent="Sending…";
 try{const o={},web=/^https?:$/.test(location.protocol);if(web)o.redirectTo=location.origin+location.pathname;

// ---- Cloud saving (Phase 2, stage 1) ----
// Local-first: the browser save stays the working copy. A private per-account copy is kept in the artifact database.
// Nothing is overwritten without a backup and, where two copies differ, an explicit choice.
const CLOUD={db:null,usr:null,uid:null,name:"",state:"init",sync:"idle",msg:"",last:0,pushing:false,timer:null,unsub:null,retry:0,seq:0,device:"",cd:null,busyOp:false,syncedJson:null,labels:{},unsubDev:null,lastCheck:0};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function meta(){try{const m=JSON.parse(localStorage.getItem("questlog_cloud")||"null");return object(m)?m:{}}catch(e){return{}}}
function setMeta(m){try{localStorage.setItem("questlog_cloud",JSON.stringify(m));return true}catch(e){return false}}
function patchMeta(p){const o=meta(),m={...o,...p};if(p.uid){delete m.optOut;if(!o.uid)m.linkedAt=Date.now()}Object.keys(m).forEach(k=>{if(m[k]===undefined)delete m[k]});return setMeta(m)}
function deviceId(){let m=meta();if(!m.device){patchMeta({device:"d"+Math.random().toString(36).slice(2,10)+Date.now().toString(36)});m=meta()}return m.device||"d-local"}
const cref=n=>CLOUD.db.doc("data/users/"+CLOUD.uid+"/"+n);
const isRevoked=d=>!!(d&&d.revoked)&&(d.revokedAt||0)>(meta().linkedAt||0);
const dcol=()=>CLOUD.db.doc("data/users/"+CLOUD.uid+"/devices").collection("items");
const dref=id=>dcol().doc(id);
function autoLabel(){const u=navigator.userAgent||"";const os=/iPhone/.test(u)?"iPhone":/iPad/.test(u)?"iPad":/Android/.test(u)?"Android":/Mac OS X|Macintosh/.test(u)?"Mac":/Windows/.test(u)?"Windows":/Linux|X11/.test(u)?"Linux":"Device";const br=/Edg\//.test(u)?"Edge":/Firefox|FxiOS/.test(u)?"Firefox":/CriOS|Chrome/.test(u)?"Chrome":/Safari/.test(u)?"Safari":"Browser";return os+" · "+br}
const rel=t=>{if(!t)return "not yet";const s=Math.max(0,Math.round((Date.now()-t)/1000));if(s<60)return "just now";if(s<3600)return Math.round(s/60)+" min ago";if(s<86400)return Math.round(s/3600)+" h ago";return new Date(t).toLocaleString([],{dateStyle:"medium",timeStyle:"short"})};
async function dbx(fn){try{return await fn()}catch(e){if(e&&e.code==="unavailable"){await sleep(400+Math.random()*600);return await fn()}throw e}}
async function withLock(fn){for(let i=0;i<8;i++){const r=await dbx(()=>cref("lock").acquire({holder:CLOUD.device,ttlMs:1800}));if(r&&r.acquired)return fn();if(i<7)await sleep(500)}throw Object.assign(new Error("Another device is syncing right now."),{busy:true})}
function explain(e){if(e&&e.busy)return "another device is syncing. Try again in a moment.";if(e&&e.code==="invalid_argument")return "your account refused this save. Sign out, sign in again and retry.";if(e&&e.code==="quota_exceeded")return "the storage limit for this app is full.";return (e&&e.message)||"please try again."}
const hasProgress=d=>d.xp>0||d.quests.length>0||d.epics.length>0||!!d.onb||Object.keys(d.ach).length>0;
const plural=(n,w)=>n+" "+w+(n===1?"":"s");
const summary=d=>`${esc(d.name)} · Level ${lvl(d.xp).l} · ${fmt(d.xp)} XP · ${fmt(d.gold||0)} gold · ${plural(d.quests.filter(q=>!q.archived).length,"quest")} · ${plural(d.epics.filter(e=>!e.archived).length,"journey")}`;
const parseCloud=cd=>normalize(JSON.parse(cd.json));
const ago=t=>t?new Date(t).toLocaleString([],{dateStyle:"medium",timeStyle:"short"}):"not yet";
function pack(rev,json){return{fmt:4,rev,device:CLOUD.device,savedAt:Date.now(),name:S.name,xp:S.xp,gold:S.gold,json:json||JSON.stringify(S)}}

function cloudStatus(){const s=CLOUD.state;
 if(s==="init")return{t:"checking",c:"var(--mu)",l:"Checking"};
 if(s==="unavailable")return{t:"not available right now. Saved on this device only",c:"var(--mu)",l:"Local only"};
 if(s==="signedout")return{t:"signed out. Saved on this device only",c:"var(--mu)",l:"Signed out"};
 if(s==="foreign")return{t:"this browser is linked to a different account",c:"var(--gold)",l:"Paused"};
 if(s==="unlinked")return{t:"not moved to your account yet",c:"var(--gold)",l:"Local only"};
 if(s==="conflict"||s==="blocked")return{t:"needs your attention",c:"var(--gold)",l:"Attention"};
 if(CLOUD.sync==="syncing")return{t:"syncing",c:"var(--pri)",l:"Syncing"};
 if(CLOUD.sync==="failed")return{t:"waiting to sync. Progress is safe on this device",c:"var(--gold)",l:"Waiting"};
 return{t:"synced",c:"var(--ok)",l:"Synced"}}
function cloudCardHtml(){const st=CLOUD.state,s=cloudStatus(),m=meta();
 let h=`<div class="row"><h3>Account and cloud save</h3><span class="chip" style="color:${s.c}">${ic("cloud",14)} ${s.l}</span></div>`;
 if(st==="init")h+=`<p class="mu">Checking for your account…</p>`;
 else if(st==="signedout")h+=authFormHtml();
 else if(st==="unavailable")h+=`<p class="mu">${esc(CLOUD.msg||"Cloud saving could not start.")} Your progress is saved on this device only. Use Export progress below to keep a backup.</p>`;
 else if(st==="foreign")h+=`<p>This browser’s progress is linked to a different account, so syncing is paused to avoid mixing the two. Nothing has been uploaded or changed. Sign out to go back to your own account; this browser’s progress stays on this device.</p><div class="actions"><button class="btn" onclick="signOutSheet()">Sign out</button><button class="btn o" onclick="unlinkSheet()">Unlink this browser</button></div>`;
 else if(st==="unlinked")h+=`${CLOUD.msg?`<p class="bad" role="status">${esc(CLOUD.msg)}</p>`:""}<p>Your progress is saved on this device only. Move it to your account to keep it safe and use it on other devices.</p><p class="mu">${summary(S)}</p><div class="actions"><button class="btn" onclick="offerSheet()">Move to my account</button></div>`;
 else if(st==="conflict")h+=`<p>Your account and this browser have different progress. Syncing is paused and nothing has been overwritten.</p><div class="actions"><button class="btn" onclick="conflictSheet()">Review and choose</button></div>`;
 else if(st==="blocked")h+=`<p class="bad">${esc(CLOUD.msg)}</p><div class="actions"><button class="btn o" onclick="downloadCloud()">Download account copy</button></div>`;
 else h+=`<p>Signed in${CLOUD.name?" as <b>"+esc(CLOUD.name)+"</b>":""}. Last synced ${rel(CLOUD.last||m.syncedAt)}.${m.dirty&&CLOUD.sync!=="syncing"?" Changes on this device are waiting to sync.":""}</p>${CLOUD.sync==="failed"?`<p class="bad">${esc(CLOUD.msg)}</p>`:""}<p class="mu" style="margin:0 0 8px">This device: <b>${esc(m.label||autoLabel())}</b></p><div class="actions"><button class="btn" onclick="syncNow()">Sync now</button></div><div class="actions"><button class="btn o" onclick="devicesSheet()">Your devices</button><button class="btn o" onclick="pointsSheet()">Restore points</button><button class="btn o" onclick="downloadCloud()">Download account copy</button></div><div class="actions"><button class="btn o" onclick="signOutSheet()">Sign out</button><button class="btn o" onclick="unlinkSheet()">Unlink this browser</button><button class="btn o" onclick="deleteSheet()">Delete account copy</button></div><div class="actions"><button class="btn o" onclick="deleteAccountSheet()">Delete my account…</button></div><p class="subtle">Backups made when you move or replace progress are kept in your account.</p>`;
 return h}
function cloudUI(){
 if(typeof TAB!=="undefined"&&TAB==="home"&&CLOUD.homeState!==CLOUD.state){CLOUD.homeState=CLOUD.state;try{render()}catch(e){}}
 const b=document.getElementById("cloudBtn");if(b){const s=cloudStatus();b.setAttribute("aria-label","Cloud saving: "+s.t);b.title="Cloud saving: "+s.t;b.style.color=s.c}
 const c=document.getElementById("cloudCard");if(c&&!(CLOUD.state==="signedout"&&c.contains(document.activeElement)&&document.getElementById("authForm")))c.innerHTML=cloudCardHtml();
 const n=document.getElementById("cloudNotice");if(n){
  if(CLOUD.state==="conflict"){n.hidden=false;n.innerHTML=`<b>Your account and this browser have different progress</b><p>Syncing is paused and nothing has been overwritten. Review both copies and choose which to keep.</p><div class="actions"><button class="btn" onclick="conflictSheet()">Review copies</button></div>`}
  else if(CLOUD.state==="blocked"){n.hidden=false;n.innerHTML=`<b>Your account copy was not loaded</b><p>${esc(CLOUD.msg)}</p><div class="actions"><button class="btn o" onclick="downloadCloud()">Download account copy</button></div>`}
  else{n.hidden=true;n.innerHTML=""}}
}

function schedulePush(ms){clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(pushNow,ms)}
function retryLater(){const d=[5000,15000,60000,120000][Math.min(CLOUD.retry++,3)];schedulePush(d)}
function cloudDirty(){
 if(CLOUD.quiet)return;
 CLOUD.seq++;
 if(CLOUD.state!=="linked"&&CLOUD.state!=="init"&&CLOUD.state!=="signedout")return;
 if(!meta().uid)return;
 if(CLOUD.syncedJson!==null&&JSON.stringify(S)===CLOUD.syncedJson)return;
 patchMeta({dirty:true});
 if(CLOUD.state==="linked")schedulePush(1500);
}
async function pushNow(){
 clearTimeout(CLOUD.timer);
 if(CLOUD.state!=="linked"||CLOUD.pushing||storageBlocked)return;
 const m=meta();if(m.uid!==CLOUD.uid||!m.dirty)return;
 let pointDone=false;
 CLOUD.pushing=true;CLOUD.sync="syncing";cloudUI();const seq=CLOUD.seq;
 try{
  await withLock(async()=>{
   const cur=await dbx(()=>cref("save").get()),cd=cur.exists?cur.data():null;
   if((cd?cd.rev:0)!==(m.rev||0))throw Object.assign(new Error("changed"),{conflict:true,cd});
   const d=pack((m.rev||0)+1);
   if(d.json.length>240000)throw Object.assign(new Error("Your save is too large for cloud storage. Export a backup and archive old items."),{fatal:true});
   if(cd&&m.lastPoint!==today){try{const slot=cref("restore_"+(dayNumber(today)%5)),ex=await dbx(()=>slot.get());if(ex.exists&&ex.data().day===today)pointDone=true;else{await dbx(()=>slot.set({takenAt:Date.now(),day:today,savedAt:cd.savedAt,rev:cd.rev,device:cd.device,json:cd.json}));pointDone=true}}catch(e){}}
   if(m.backupFirst&&cd)await dbx(()=>cref("backup_replaced").set({savedAt:Date.now(),device:cd.device,rev:cd.rev,json:cd.json}));
   await dbx(()=>cref("save").set(d));
   CLOUD.syncedJson=d.json;
   patchMeta({rev:d.rev,syncedAt:Date.now(),dirty:CLOUD.seq!==seq,backupFirst:false,lastPoint:pointDone?today:m.lastPoint});
  });
  CLOUD.sync="idle";CLOUD.retry=0;CLOUD.last=Date.now();CLOUD.msg="";touchDevice(false);
  if(meta().dirty)schedulePush(300);
 }catch(e){
  if(e.conflict)enterConflict(e.cd);
  else if(e.busy){CLOUD.sync="failed";CLOUD.msg="Another device is syncing. Retrying shortly.";retryLater()}
  else if(e.fatal){CLOUD.sync="failed";CLOUD.msg=e.message}
  else if(e.code==="invalid_argument"||e.code==="quota_exceeded"){CLOUD.sync="failed";CLOUD.msg="Could not save to your account: "+explain(e)}
  else{CLOUD.sync="failed";CLOUD.msg="Could not reach your account. Your progress is safe on this device and will sync when it can.";retryLater()}
 }finally{CLOUD.pushing=false;cloudUI()}
}
async function syncNow(){
 if(CLOUD.state!=="linked")return;
 try{const s=await dbx(()=>cref("save").get()),m=meta();
  if(s.exists){const d=s.data();if((d.rev||0)>(m.rev||0)){if(m.dirty)return enterConflict(d);return void pullApply(d,"Loaded your latest progress")}}
  if(!meta().dirty){CLOUD.last=Date.now();CLOUD.sync="idle";cloudUI();return toast("Already up to date")}
  pushNow()
 }catch(e){CLOUD.sync="failed";CLOUD.msg="Could not reach your account.";cloudUI()}
}
function enterConflict(cd){CLOUD.state="conflict";CLOUD.cd=cd||null;clearTimeout(CLOUD.timer);CLOUD.sync="idle";cloudUI();toast("Your account and this browser have different progress. Syncing is paused.")}
function stopListen(){for(const k of ["unsub","unsubDev"]){if(CLOUD[k]){try{CLOUD[k]()}catch(e){}CLOUD[k]=null}}}
function startListen(){
 stopListen();
 try{CLOUD.unsub=cref("save").onSnapshot(snap=>{
  if(!snap.exists||CLOUD.state!=="linked")return;const d=snap.data();if(!d||d.device===CLOUD.device)return;
  const m=meta();if((d.rev||0)>(m.rev||0)){if(m.dirty||CLOUD.pushing)enterConflict(d);else pullApply(d,"Updated from another device")}
 },e=>{CLOUD.msg="Live updates stopped. Reload to resume.";cloudUI()})}catch(e){}
 // Register this device first, so an old "disconnected" mark cannot undo a deliberate re-link.
 touchDevice(true).then(()=>{
  if(CLOUD.state!=="linked"||CLOUD.unsubDev)return;
  try{CLOUD.unsubDev=dref(CLOUD.device).onSnapshot(s=>{if(s.exists&&isRevoked(s.data())&&CLOUD.state==="linked")remoteUnlink()},()=>{})}catch(e){}
  return loadDevices()}).catch(()=>{});
}
async function touchDevice(force){
 const m=meta();if(!CLOUD.db||!CLOUD.uid)return;if(!force&&Date.now()-(m.lastTouch||0)<900000)return;
 try{await dbx(()=>dref(CLOUD.device).set({label:m.label||autoLabel(),seen:Date.now(),first:m.firstSeen||Date.now(),revoked:false,revokedAt:0}));patchMeta({lastTouch:Date.now(),firstSeen:m.firstSeen||Date.now()})}catch(e){}
}
async function loadDevices(){
 const q=await dbx(()=>dcol().get());const list=q.docs.map(d=>({id:d.id,...d.data()}));list.forEach(x=>{CLOUD.labels[x.id]=x.label||"another device"});return list;
}
async function remoteUnlink(){
 if(CLOUD.state!=="linked"||CLOUD.unlinking)return;CLOUD.unlinking=true;
 try{const cur=await dbx(()=>dref(CLOUD.device).get());if(!(cur.exists&&isRevoked(cur.data())))return;if(CLOUD.state!=="linked")return}catch(e){return}finally{CLOUD.unlinking=false}
 stopListen();clearTimeout(CLOUD.timer);const m=meta();setMeta({device:CLOUD.device,label:m.label,optOut:true});
 CLOUD.msg="This browser was disconnected from your account from another device. Your progress here was kept. Use Move to my account to connect again.";CLOUD.state="unlinked";CLOUD.cd=null;CLOUD.syncedJson=null;CLOUD.sync="idle";cloudUI();
 toast("This device was disconnected from your account. Progress on this device was kept.");
}
async function resumeCheck(){
 if(CLOUD.state!=="linked"||CLOUD.pushing||CLOUD.busyOp||storageBlocked||Date.now()-CLOUD.lastCheck<8000)return;CLOUD.lastCheck=Date.now();
 try{
  const m=meta(),mine=await dbx(()=>dref(CLOUD.device).get());if(mine.exists&&isRevoked(mine.data()))return remoteUnlink();
  const s=await dbx(()=>cref("save").get());
  if(s.exists){const d=s.data();if((d.rev||0)>(m.rev||0)){if(m.dirty)return enterConflict(d);return void pullApply(d,"Updated from another device")}}
  if(m.dirty)schedulePush(300);else{CLOUD.last=Date.now();CLOUD.sync="idle";cloudUI()}
 }catch(e){}
}
// Replace the working copy with an account copy. The copy being replaced is backed up in this browser first.
function pullApply(d,msg){
 let data;try{data=parseCloud(d)}catch(e){CLOUD.state="blocked";CLOUD.msg="The account copy could not be read, so it was not loaded: "+e.message;cloudUI();return false}
 try{const raw=localStorage.getItem("questlog");if(raw)localStorage.setItem("questlog_backup_before_cloud_pull",raw)}catch(e){}
 const before=JSON.stringify(data);
 S=data;today=key(new Date());yest=addDays(today,-1);rollover();
 if(Object.values(S.week.done).some(n=>n>0)||Object.keys(S.week.gp).length||S.reviews[S.week.k])S.week.locked=true;
 CLOUD.syncedJson=d.json;patchMeta({uid:CLOUD.uid,rev:d.rev||0,dirty:false,syncedAt:Date.now(),backupFirst:false});
 if(JSON.stringify(S)!==before)save();else{try{localStorage.setItem("questlog",JSON.stringify(S))}catch(e){}}
 CLOUD.state="linked";CLOUD.sync="idle";CLOUD.last=Date.now();CLOUD.cd=null;
 render();if(msg)toast(msg);return true;
}

function offerSheet(){
 sheet(`<h3>Move your progress to your account?</h3><p>This browser has saved progress:</p><p class="t">${summary(S)}</p><p class="mu">A backup of this browser’s copy is stored in your account first, then the account copy is checked against it. Your progress on this device is not deleted.</p><div class="actions"><button class="btn" id="offerGo">Move to my account</button><button class="btn o" onclick="closeSheet()">Not now</button></div>`);
 document.getElementById("offerGo").onclick=linkLocal;
}
async function linkLocal(){
 if(CLOUD.busyOp)return toast("Another account action is still running. Wait a moment and try again.");CLOUD.busyOp=true;CLOUD.msg="";toast("Checking your account…");
 try{
  if(!CLOUD.db||!CLOUD.uid)throw Error("Sign in to your account first.");
  if(storageBlocked)throw Error("Your saved data could not be read, so it can’t be moved. Restore a backup first.");
  refreshDay();const json=JSON.stringify(S);let existing=null;
  await withLock(async()=>{
   const ex=await dbx(()=>cref("save").get());if(ex.exists){existing=ex.data();return}
   if(json.length>240000)throw Object.assign(new Error("Your save is too large for cloud storage. Export a backup and archive old items."),{fatal:true});
   await dbx(()=>cref("backup_link").set({savedAt:Date.now(),device:CLOUD.device,json}));
   await dbx(()=>cref("save").set(pack(1,json)));
  });
  if(existing){
   let same=false;try{same=JSON.stringify(parseCloud(existing))===JSON.stringify(S)}catch(e){}
   if(same){patchMeta({uid:CLOUD.uid,rev:existing.rev||0,dirty:false,syncedAt:Date.now()});CLOUD.syncedJson=existing.json;CLOUD.state="linked";CLOUD.sync="idle";CLOUD.last=Date.now();startListen();closeSheet();cloudUI();toast("Already matches your account copy");return}
   CLOUD.cd=existing;CLOUD.state="conflict";cloudUI();conflictSheet();return;
  }
  const v=await dbx(()=>cref("save").get());
  if(!v.exists||v.data().json!==json)throw Error("The account copy did not match, so nothing was changed on this device. Try again.");
  CLOUD.syncedJson=json;patchMeta({uid:CLOUD.uid,rev:1,dirty:false,syncedAt:Date.now(),backupFirst:false});
  CLOUD.state="linked";CLOUD.sync="idle";CLOUD.last=Date.now();CLOUD.cd=null;startListen();closeSheet();cloudUI();toast("Your progress is now saved to your account");
 }catch(e){CLOUD.msg="Could not move your progress to your account: "+explain(e)+(e&&e.code?" (code: "+e.code+")":"");cloudUI();sheet(`<h3>Could not move your progress</h3><p class="bad">${esc(explain(e))}${e&&e.code?" (code: "+esc(e.code)+")":""}</p><p class="mu">Nothing was changed on this device or in your account.</p><div class="actions"><button class="btn" id="retryLink">Try again</button><button class="btn o" onclick="closeSheet()">Close</button></div>`);document.getElementById("retryLink").onclick=()=>{closeSheet();offerSheet()}}
 finally{CLOUD.busyOp=false}
}
function conflictSheet(){
 const cd=CLOUD.cd;let acct=null,err="";
 if(cd){try{acct=parseCloud(cd)}catch(e){err=e.message}}
 const box=(t,body)=>`<div class="card" style="box-shadow:none;margin:8px 0"><b>${t}</b><p class="mu" style="margin:4px 0 0">${body}</p></div>`;
 sheet(`<h3>Choose which progress to keep</h3><p class="mu">Nothing is overwritten until you choose. The copy you replace is backed up first.</p>${box("This browser",summary(S))}${cd?(acct?box("Your account",summary(acct)+"<br>Saved "+ago(cd.savedAt)+(cd.device&&CLOUD.labels[cd.device]?" on "+esc(CLOUD.labels[cd.device]):"")):`<p class="bad">The account copy could not be read (${esc(err)}). It has not been changed.</p>`):`<p class="mu">No account copy was found. It may have been deleted from another device.</p>`}<div class="actions" style="flex-direction:column;align-items:stretch">${acct?'<button class="btn" id="keepAcct">Keep account copy</button>':""}<button class="btn o" id="keepLocal">${cd?"Keep this browser’s copy":"Upload this browser’s copy"}</button><button class="btn o" id="laterBtn">Decide later</button></div>`);
 document.getElementById("laterBtn").onclick=closeSheet;
 document.getElementById("keepLocal").onclick=()=>{patchMeta({uid:CLOUD.uid,rev:cd?cd.rev||0:0,dirty:true,backupFirst:!!cd});CLOUD.state="linked";CLOUD.sync="idle";CLOUD.cd=null;CLOUD.syncedJson=null;startListen();closeSheet();cloudUI();pushNow()};
 const ka=document.getElementById("keepAcct");
 if(ka)ka.onclick=async()=>{
  if(CLOUD.busyOp)return toast("Still working on the last step. Wait a moment.");CLOUD.busyOp=true;toast("Backing up and loading your account copy…");
  try{
   await withLock(()=>dbx(()=>cref("backup_pull").set({savedAt:Date.now(),device:CLOUD.device,json:JSON.stringify(S)})));
   const ok=pullApply(cd,"Loaded your account’s progress. Your browser copy was backed up.");
   if(ok){startListen();closeSheet()}
  }catch(e){toast("Could not back up first, so nothing was changed: "+explain(e))}
  finally{CLOUD.busyOp=false}
 };
}
async function restoreFromAccount(){
 if(!CLOUD.db||!CLOUD.uid)return toast("Sign in to your account first");
 try{
  const s=await dbx(()=>cref("save").get());if(!s.exists)return toast("There is no account copy to restore");
  const cd=s.data();let a;try{a=parseCloud(cd)}catch(e){return toast("The account copy could not be read: "+e.message)}
  sheet(`<h3>Restore from your account?</h3><p>This replaces what is stored in this browser with:</p><p class="t">${summary(a)}</p><p class="mu">Saved ${ago(cd.savedAt)}. What is currently stored here is backed up first.</p><div class="actions"><button class="btn" id="restoreGo">Restore</button><button class="btn o" onclick="closeSheet()">Cancel</button></div>`);
  document.getElementById("restoreGo").onclick=()=>{storageBlocked=false;storageError="";CLOUD.state="linked";patchMeta({uid:CLOUD.uid});if(pullApply(cd,"Restored from your account")){startListen();storageNotice()}closeSheet()};
 }catch(e){toast("Could not reach your account")}
}
async function downloadCloud(){
 try{const s=await dbx(()=>cref("save").get());if(!s.exists)return toast("No account copy found");
  let txt=s.data().json;try{txt=JSON.stringify(JSON.parse(txt),null,2)}catch(e){}
  downloadText("Questlog-account-copy-"+today+".json",txt)}catch(e){toast("Could not reach your account")}
}
function unlinkSheet(){
 sheet(`<h3>Unlink this browser?</h3><p>Your progress stays on this device and in your account, but they will stop updating each other. You can move progress to your account again later.</p>${meta().dirty?'<p class="bad">This device has changes that have not synced yet. They will stay on this device only.</p>':""}<div class="actions"><button class="btn" id="unlinkGo">Unlink</button><button class="btn o" onclick="closeSheet()">Cancel</button></div>`);
 document.getElementById("unlinkGo").onclick=async()=>{
  stopListen();clearTimeout(CLOUD.timer);try{await dref(CLOUD.device).delete()}catch(e){}
  const m=meta();setMeta({device:CLOUD.device,label:m.label,optOut:true});CLOUD.state="unlinked";CLOUD.cd=null;CLOUD.syncedJson=null;closeSheet();cloudUI();toast("This browser is unlinked");
 };
}
function deleteSheet(){
 sheet(`<h3>Delete your account copy?</h3><p>This permanently deletes your Questlog save, its backups, restore points and device list from your account. Progress on this device is not changed. Download a copy first if you are unsure.</p><label style="display:flex;gap:10px;align-items:center;margin:12px 0"><input type="checkbox" id="delOk" style="width:auto;margin:0;min-height:0"> I understand this cannot be undone</label><div class="actions"><button class="btn" id="delGo" disabled>Delete account copy</button><button class="btn o" onclick="closeSheet()">Cancel</button></div>`);
 document.getElementById("delOk").onchange=e=>{document.getElementById("delGo").disabled=!e.target.checked};
 document.getElementById("delGo").onclick=async()=>{
  toast("Deleting…");
  try{
   await withLock(async()=>{
    for(const n of ["save","backup_link","backup_replaced","backup_pull","restore_0","restore_1","restore_2","restore_3","restore_4"])await dbx(()=>cref(n).delete());
    const q=await dbx(()=>dcol().get());for(const d of q.docs)await dbx(()=>dref(d.id).delete());
   });
   try{await cref("devices").delete()}catch(e){}try{await cref("lock").delete()}catch(e){}
   stopListen();clearTimeout(CLOUD.timer);const m=meta();setMeta({device:CLOUD.device,label:m.label});CLOUD.state="unlinked";CLOUD.cd=null;CLOUD.syncedJson=null;CLOUD.labels={};closeSheet();cloudUI();toast("Account copy deleted. Progress on this device was not changed.");
  }catch(e){closeSheet();toast("Could not delete: "+explain(e))}
 };
}
// ---- Devices and restore points ----
function devHtml(list){
 const rows=list.sort((a,b)=>(b.seen||0)-(a.seen||0)).map(x=>{const me=x.id===CLOUD.device;
  return `<div class="row" style="padding:10px 0;border-top:1px solid var(--ln)"><div class="g1"><div class="t">${esc(x.label||"Device")}${me?' <span class="chip">This device</span>':""}${x.revoked?' <span class="chip g">Disconnected</span>':""}</div><div class="mu">Last active ${rel(x.seen)}</div></div>${me?'<button class="btn o" onclick="renameDevice()">Rename</button>':`<button class="btn o" onclick="deviceAction('${esc(x.id)}',${!!x.revoked})">${x.revoked?"Remove":"Disconnect"}</button>`}</div>`}).join("");
 return `<h3>Your devices</h3><p class="mu">Browsers signed in to your account. Disconnecting one stops it from syncing the next time it is open. Its own progress stays on that device.</p>${rows||'<p class="mu">No devices listed yet.</p>'}`;
}
async function devicesSheet(){
 sheet(`<h3>Your devices</h3><p class="mu">Loading…</p>`);
 try{sheet(devHtml(await loadDevices()))}catch(e){sheet(`<h3>Your devices</h3><p class="bad">Could not load devices: ${esc(explain(e))}</p>`)}
}
function renameDevice(){
 const m=meta();sheet(`<h3>Rename this device</h3><form id="renameForm"><label class="form-label" for="devName">Name</label><input id="devName" maxlength="40" value="${esc(m.label||autoLabel())}" required><button class="btn">Save name</button></form>`);
 document.getElementById("renameForm").onsubmit=async e=>{e.preventDefault();const v=document.getElementById("devName").value.trim().slice(0,40);if(!v)return;patchMeta({label:v});await touchDevice(true);cloudUI();devicesSheet()};
}
async function deviceAction(id,revoked){
 try{
  if(revoked)await dbx(()=>dref(id).delete());
  else{const s=await dbx(()=>dref(id).get());if(s.exists)await dbx(()=>dref(id).set({...s.data(),revoked:true,revokedAt:Date.now()}))}
  toast(revoked?"Removed from the list":"Device disconnected");devicesSheet();
 }catch(e){toast("Could not update the device: "+explain(e))}
}
async function pointsSheet(){
 sheet(`<h3>Restore points</h3><p class="mu">Loading…</p>`);
 try{
  const items=[];
  for(let i=0;i<5;i++){const s=await dbx(()=>cref("restore_"+i).get());if(s.exists){const d=s.data();try{items.push({i,d,a:parseCloud(d)})}catch(e){}}}
  items.sort((x,y)=>(y.d.takenAt||0)-(x.d.takenAt||0));
  sheet(`<h3>Restore points</h3><p class="mu">The first sync each day keeps the previous account copy here, for up to five days. Restoring replaces your progress with that copy. Your current copies are backed up first.</p>${items.length?items.map(x=>`<div style="padding:10px 0;border-top:1px solid var(--ln)"><div class="t">${ago(x.d.savedAt||x.d.takenAt)}</div><div class="mu">${summary(x.a)}</div><button class="btn o" style="margin-top:6px" onclick="confirmPoint(${x.i})">Restore this</button></div>`).join(""):'<p class="mu">No restore points yet. One is created the first time you sync each day once your account copy exists.</p>'}`);
 }catch(e){sheet(`<h3>Restore points</h3><p class="bad">Could not load them: ${esc(explain(e))}</p>`)}
}
async function confirmPoint(i){
 try{
  const s=await dbx(()=>cref("restore_"+i).get());if(!s.exists)return toast("That restore point is gone");const d=s.data();const a=parseCloud(d);
  sheet(`<h3>Restore this version?</h3><p class="t">${summary(a)}</p><p class="mu">Saved ${ago(d.savedAt||d.takenAt)}. Your current progress is backed up in this browser and in your account first, then this version replaces it everywhere you are signed in.</p><div class="actions"><button class="btn" id="pointGo">Restore</button><button class="btn o" onclick="closeSheet()">Cancel</button></div>`);
  document.getElementById("pointGo").onclick=()=>restorePoint(i);
 }catch(e){toast("Could not read that restore point: "+explain(e))}
}
async function restorePoint(i){
 if(CLOUD.busyOp||CLOUD.state!=="linked")return;CLOUD.busyOp=true;
 try{
  const rp=await dbx(()=>cref("restore_"+i).get());if(!rp.exists)throw Error("That restore point is gone.");const d=rp.data();parseCloud(d);
  let rev=0;
  await withLock(async()=>{const cur=await dbx(()=>cref("save").get());rev=cur.exists?(cur.data().rev||0):0;await dbx(()=>cref("backup_pull").set({savedAt:Date.now(),device:CLOUD.device,json:JSON.stringify(S)}))});
  clearTimeout(CLOUD.timer);
  if(!pullApply({json:d.json,rev},"Restored. Syncing it to your account…"))return;
  CLOUD.syncedJson=null;patchMeta({dirty:true,backupFirst:true});closeSheet();schedulePush(100);
 }catch(e){toast("Could not restore: "+explain(e))}
 finally{CLOUD.busyOp=false}
}

async function cloudInit(){
 CLOUD.device=deviceId();
 if(!window.supabase||typeof window.supabase.createClient!=="function"){CLOUD.state="unavailable";CLOUD.msg="The cloud library could not load. Check your connection and reload.";return cloudUI()}
 let ses=null;try{const g=await sbClient().auth.getSession();ses=g&&g.data&&g.data.session}catch(e){CLOUD.state="unavailable";CLOUD.msg="Could not reach the sign-in service.";return cloudUI()}
 watchAuth();
 if(!ses||!ses.user){CLOUD.state="signedout";CLOUD.db=null;CLOUD.uid=null;return cloudUI()}
 CLOUD.db=sbDb(sbClient(),ses.user.id);CLOUD.usr=sbUser(ses.user);CLOUD.uid=ses.user.id;CLOUD.name=ses.user.email||"";
 const m=meta();
 if(m.uid&&m.uid!==CLOUD.uid){CLOUD.state="foreign";return cloudUI()}
 // An unreadable local save is never touched automatically. The notice offers an explicit restore.
 if(storageBlocked){CLOUD.state=m.uid===CLOUD.uid?"linked":"unlinked";storageNotice();return cloudUI()}
 if(m.optOut){CLOUD.state="unlinked";return cloudUI()}
 try{await loadDevices()}catch(e){}
 let snap;
 try{snap=await dbx(()=>cref("save").get())}
 catch(e){if(m.uid===CLOUD.uid){CLOUD.state="linked";CLOUD.sync="failed";CLOUD.msg="Could not reach your account. Progress is safe on this device and will sync when it can.";retryLater()}else{CLOUD.state="unavailable"}return cloudUI()}
 const cd=snap.exists?snap.data():null,meaningful=hasProgress(S);
 if(m.uid===CLOUD.uid){
  try{const mine=await dbx(()=>dref(CLOUD.device).get());if(mine.exists&&isRevoked(mine.data()))return remoteUnlink()}catch(e){}
  CLOUD.state="linked";
  if(!cd){if((m.rev||0)>0)return enterConflict(null)}
  else if((cd.rev||0)>(m.rev||0)){if(m.dirty)return enterConflict(cd);startListen();pullApply(cd,"Loaded your latest progress from your account");return}
  else if((cd.rev||0)<(m.rev||0))return enterConflict(cd);
  else{CLOUD.syncedJson=cd.json;patchMeta({dirty:JSON.stringify(S)!==cd.json})}
  startListen();
  if(meta().dirty||(!cd&&meaningful))schedulePush(200);
  return cloudUI();
 }
 if(!cd){
  if(!meaningful){patchMeta({uid:CLOUD.uid,rev:0,dirty:false});CLOUD.state="linked";startListen();return cloudUI()}
  CLOUD.state="unlinked";cloudUI();offerSheet();return;
 }
 if(!meaningful){startListen();CLOUD.state="linked";pullApply(cd,"Loaded your progress from your account");return}
 let same=false;try{same=JSON.stringify(parseCloud(cd))===JSON.stringify(S)}catch(e){}
 if(same){patchMeta({uid:CLOUD.uid,rev:cd.rev||0,dirty:false,syncedAt:Date.now()});CLOUD.syncedJson=cd.json;CLOUD.state="linked";startListen();return cloudUI()}
 CLOUD.state="conflict";CLOUD.cd=cd;cloudUI();conflictSheet();
}
async function cloudBoot(){
 let done=false;const wizard=()=>{if(done)return;done=true;if(isNew&&CLOUD.state!=="signedout"&&!storageBlocked&&!hasProgress(S)&&!S.onb&&!document.getElementById("ov").classList.contains("on"))wiz(1)};
 const t=setTimeout(wizard,3500);
 try{await cloudInit()}catch(e){CLOUD.state=CLOUD.state==="init"?"unavailable":CLOUD.state;CLOUD.msg=(e&&e.message)||"";cloudUI()}
 clearTimeout(t);wizard();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&CLOUD.state==="linked"&&meta().dirty)pushNow();if(document.visibilityState==="visible")resumeCheck()});
window.addEventListener("online",()=>{if(CLOUD.state==="linked"){if(meta().dirty)schedulePush(500);resumeCheck()}});
window.addEventListener("focus",()=>resumeCheck());
setInterval(()=>{if(TAB==="me"&&!document.getElementById("ov").classList.contains("on"))cloudUI()},60000);

// ---- Keep saves under the account's size limit ----
// Nothing changes for normal saves. Only when a save grows past PRUNE_AT characters is old, low-value history trimmed:
// daily XP history, old journey log entries and old weekly reviews. Quests, journeys, totals, streaks, gold and
// achievements are never touched. The first time it happens, the untrimmed copy is kept on this device.
const PRUNE_AT=180000,PRUNE_HARD=250000;
let pruneNoted=false;
function trimHistory(days,logs,reviews){
 const cut=addDays(today,-days);Object.keys(S.hist).forEach(k=>{if(k<cut)delete S.hist[k]});
 S.epics.forEach(e=>{if(Array.isArray(e.logs)&&e.logs.length>logs)e.logs=e.logs.slice(-logs)});
 const ks=Object.keys(S.reviews).sort();ks.slice(0,Math.max(0,ks.length-reviews)).forEach(k=>{if(k!==S.week.k)delete S.reviews[k]})}
function pruneIfLarge(){
 let j=JSON.stringify(S);if(j.length<=PRUNE_AT)return j;
 try{if(!localStorage.getItem("questlog_backup_before_prune"))localStorage.setItem("questlog_backup_before_prune",j)}catch(e){}
 trimHistory(400,100,52);j=JSON.stringify(S);
 if(j.length>PRUNE_HARD){trimHistory(120,30,12);j=JSON.stringify(S)}
 if(!pruneNoted){pruneNoted=true;try{toast("Older history was trimmed to keep your saves small. A full copy was kept on this device.")}catch(e){}}
 return j}

// Refresh on resume and before actions, including an overnight tab.
rollover();
// Existing completions/reviews immediately freeze the migration week's known commitments.
if(Object.values(S.week.done).some(n=>n>0)||Object.keys(S.week.gp).length||S.reviews[S.week.k])S.week.locked=true;
CLOUD.quiet=true;save();CLOUD.quiet=false;render();cloudBoot();
if(migrationNotice)setTimeout(()=>toast(migrationNotice),800);
setInterval(()=>{if(document.visibilityState!=="hidden"&&refreshDay())render()},30000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&refreshDay())render()});
window.addEventListener("focus",()=>{if(refreshDay())render()});
window.addEventListener("storage",e=>{if(e.key==="questlog"){storageBlocked=true;storageError="Questlog changed in another tab. Reload to use that save and avoid overwriting it.";storageNotice()}});

</script>
